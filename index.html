<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cii.中国 — 喜爱中国</title>
<style id="templateStyle">:root{--bg:#050510;--bg2:#0a0a1a;--bg3:rgba(255,255,255,0.03);--bg4:rgba(0,200,255,0.05);--primary:#00c8ff;--secondary:#7b61ff;--accent:#ff61d8;--text:#e0e0e0;--text2:#8aaec8;--text3:#5a7a90;--border:rgba(0,200,255,0.12);--card-bg:rgba(255,255,255,0.03);--card-hover:rgba(0,200,255,0.06);--header-bg:linear-gradient(180deg,rgba(5,5,16,0.95),transparent);--font:'Microsoft YaHei','PingFang SC',sans-serif;--radius:12px;--glow:0 0 30px rgba(0,200,255,0.08);--hero-grad:linear-gradient(135deg,#00c8ff,#7b61ff)}</style>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--primary);text-decoration:none}
a:hover{opacity:0.8}
img{max-width:100%;height:auto;border-radius:6px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(0,200,255,0.2);border-radius:3px}
/* HEADER */
.top-header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;padding:0 20px;height:56px;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--primary);letter-spacing:2px;white-space:nowrap}
.logo img{height:28px}
.top-nav{display:flex;gap:2px;flex:1;overflow-x:auto;margin:0 8px}
.top-nav a{padding:5px 10px;border-radius:5px;font-size:12px;color:var(--text2);white-space:nowrap;cursor:pointer;transition:all 0.3s}
.top-nav a:hover,.top-nav a.active{background:var(--bg4);color:var(--primary)}
.header-right{font-size:11px;color:var(--text3);white-space:nowrap;display:flex;align-items:center;gap:8px}
/* HERO */
.hero{background:var(--bg2);padding:30px 20px;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:16px}
.hero-main{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform 0.3s;position:relative}
.hero-main:hover{transform:translateY(-2px)}
.hero-main img{width:100%;height:300px;object-fit:cover}
.hero-main .hero-info{position:absolute;bottom:0;left:0;right:0;padding:60px 20px 16px;background:linear-gradient(transparent,rgba(0,0,0,0.9))}
.hero-main .hero-info h2{font-size:22px;color:#fff;margin-bottom:4px}
.hero-main .hero-info .meta{font-size:12px;color:var(--text3)}
.hero-side{display:flex;flex-direction:column;gap:10px}
.hero-side-item{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all 0.3s;flex:1;display:flex;flex-direction:column;justify-content:center}
.hero-side-item:hover{background:var(--card-hover)}
.hero-side-item h4{font-size:14px;color:var(--text);margin-bottom:2px}
.hero-side-item .meta{font-size:11px;color:var(--text3)}
/* SECTION TITLE */
.section-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 12px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-header h2{font-size:22px;background:var(--hero-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;letter-spacing:2px}
.section-header .more{font-size:12px;color:var(--text3);cursor:pointer}
.section-header .more:hover{color:var(--primary)}
/* ARTICLE GRID */
.article-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.article-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all 0.4s}
.article-card:hover{transform:translateY(-3px);background:var(--card-hover);box-shadow:var(--glow)}
.article-card .card-img{width:100%;height:160px;object-fit:cover;display:block}
.article-card .card-body{padding:14px}
.article-card .card-body h3{font-size:15px;margin-bottom:4px;line-height:1.5}
.article-card .card-body .meta{font-size:11px;color:var(--text3)}
.article-card .card-body .desc{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* ARTICLE LIST */
.article-list{display:flex;flex-direction:column;gap:6px}
.article-list-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background 0.2s}
.article-list-item:hover{background:var(--bg4)}
.article-list-item img{width:80px;height:56px;object-fit:cover;border-radius:4px}
.article-list-item .info{flex:1;min-width:0}
.article-list-item .info h4{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.article-list-item .info .meta{font-size:11px;color:var(--text3)}
.article-list-item .badge{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg4);color:var(--primary);white-space:nowrap}
/* VIDEO */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.video-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all 0.4s}
.video-card:hover{transform:translateY(-3px);box-shadow:var(--glow)}
.video-card .vthumb{aspect-ratio:16/9;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:42px;position:relative}
.video-card .vthumb .play-btn{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(0,200,255,0.15);border:2px solid rgba(0,200,255,0.4);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--primary);transition:all 0.3s}
.video-card:hover .play-btn{background:rgba(0,200,255,0.3);transform:scale(1.1)}
.video-card .vinfo{padding:12px 14px}
.video-card .vinfo h4{font-size:14px;margin-bottom:2px}
.video-card .vinfo p{font-size:11px;color:var(--text3)}
/* FOOTER */
.footer{background:var(--bg2);border-top:1px solid var(--border);padding:30px 20px;text-align:center;font-size:12px;color:var(--text3);line-height:2;margin-top:10px}
.footer strong{color:var(--text2)}
.admin-link{position:fixed;bottom:16px;right:20px;font-size:10px;color:var(--text3);opacity:0.35;z-index:100;text-decoration:none;transition:opacity 0.3s}
.admin-link:hover{opacity:1}
/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal-overlay.open{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);width:90%;max-width:800px;max-height:88vh;overflow-y:auto;padding:28px 32px;position:relative}
.modal-box::-webkit-scrollbar{width:4px}
.modal-box::-webkit-scrollbar-thumb{background:rgba(0,200,255,0.2);border-radius:2px}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;cursor:pointer;color:var(--text3);background:none;border:none;transition:color 0.3s}
.modal-close:hover{color:var(--primary)}
.modal-article-title{font-size:22px;font-weight:700;color:var(--primary);margin-bottom:4px}
.modal-article-meta{font-size:12px;color:var(--text3);margin-bottom:12px}
.modal-article-body{font-size:14px;line-height:2;color:var(--text2)}
.modal-article-body img{display:block;margin:12px auto;max-height:400px;border-radius:8px}
.modal-article-body .video-embed{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;margin:12px 0}
.modal-article-body .video-embed iframe{position:absolute;top:0;left:0;width:100%;height:100%}
/* comment section in modal */
.comment-section{margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
.comment-section h4{font-size:14px;margin-bottom:8px;color:var(--text2)}
.comment-input{display:flex;gap:8px;margin-bottom:10px}
.comment-input input{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 12px;font-size:13px;outline:none;transition:border-color 0.3s}
.comment-input input:focus{border-color:var(--primary)}
.comment-input button{padding:8px 16px;background:var(--hero-grad);border:none;color:#fff;border-radius:6px;cursor:pointer;font-size:13px}
.comment-item{padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.comment-item:last-child{border-bottom:none}
.comment-item .meta{font-size:11px;color:var(--text3)}
.comment-item .content{font-size:13px;margin-top:2px}
/* RESPONSIVE */
@media(max-width:768px){
.hero{grid-template-columns:1fr}.hero-main img{height:200px}.top-nav{display:none}.section-wrap{padding:16px 12px}.article-grid{grid-template-columns:1fr}.video-grid{grid-template-columns:1fr}.modal-box{padding:16px}}
</style>
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="logo"><img src="logo.png" alt="Cii">Cii.中国</div>
    <div class="top-nav" id="topNav"></div>
    <div class="header-right"><span id="dateDisplay"></span></div>
  </div>
</header>

<section class="hero" id="heroSection"></section>

<div id="contentSections"></div>

<footer class="footer">
  <strong>Cii.中国 — 喜爱中国</strong><br>
  中国 · 上海 · 宝山 · 《喜爱中国》执编中心<br>
  E-mail：Axiomis@qq.com | 通话请先短信预约：+86-132-8807-8868<br>
  主办：上海第三只眼传播发展有限公司<br>
  版权所有 未经书面授权禁止使用
</footer>

<a class="admin-link" href="admin" target="_blank">⚙ 管理</a>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
let sections={},articles=[],videos=[];
let week='日一二三四五六';

async function api(url,body){
  try{
    const opt={method:'GET',headers:{'Content-Type':'application/json'}};
    if(body){opt.method='POST';opt.body=JSON.stringify(body)}
    const r=await fetch(url,opt);return r.json();
  }catch(e){return null}
}

async function loadData(){
  const r=await api('/api/frontend-data');
  if(r){articles=r.articles||[];sections=r.sections||{};videos=r.videos||[]}
  const t=await api('/api/template/css');
  if(t&&t.css)document.getElementById('templateStyle').textContent=t.css;
}

function renderNav(){
  const nav=document.getElementById('topNav');
  const keys=Object.keys(sections);
  nav.innerHTML=keys.map(k=>'<a onclick="scrollToSection(\''+k+'\')">'+sections[k]+'</a>').join('');
  if(videos.length)nav.innerHTML+='<a onclick="document.getElementById(\'videoSection\').scrollIntoView({behavior:\'smooth\'})">视频中心</a>';
}

function scrollToSection(key){
  const el=document.getElementById('sec-'+key);
  if(el)el.scrollIntoView({behavior:'smooth'});
}

function renderHero(){
  const container=document.getElementById('heroSection');
  const featured=articles.filter(a=>a.featured);
  if(!featured.length){container.innerHTML='';return}
  const main=featured[0];
  const side=featured.slice(1,4);
  container.innerHTML=
    '<div class="hero-main" onclick="openArticle(\''+main.id+'\')">'+
    (main.images&&main.images[0]?'<img src="'+main.images[0]+'" onerror="this.style.display=\'none\'" alt="">':'<div style="height:300px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:48px">'+(sections[main.section]||'📰')+'</div>')+
    '<div class="hero-info"><h2>'+main.title+'</h2><div class="meta">'+(main.source?main.source+' · ':'')+(main.date||'')+'</div></div></div>'+
    '<div class="hero-side">'+
    side.map(a=>'<div class="hero-side-item" onclick="openArticle(\''+a.id+'\')"><h4>'+a.title+'</h4><div class="meta">'+(a.date||'')+'</div></div>').join('')+
    '</div>';
}

function renderContentSections(){
  const container=document.getElementById('contentSections');
  const keys=Object.keys(sections);
  let html='';
  keys.forEach(k=>{
    const secArticles=articles.filter(a=>a.section===k);
    if(!secArticles.length)return;
    html+='<div class="section-wrap" id="sec-'+k+'">'+
      '<div class="section-header"><h2>'+(sections[k]||k)+'</h2></div>'+
      '<div class="article-grid">'+
      secArticles.map(a=>'<div class="article-card" onclick="openArticle(\''+a.id+'\')">'+
        (a.images&&a.images[0]?'<img class="card-img" src="'+a.images[0]+'" onerror="this.style.display=\'none\'" alt="">':'')+
        '<div class="card-body"><h3>'+a.title+'</h3><div class="meta">'+(a.source?'<span>'+a.source+'</span>':'')+(a.source&&a.date?' · ':'')+(a.date||'')+'</div>'+
        '<div class="desc">'+(a.content||'').replace(/<[^>]+>/g,'').substring(0,120)+'</div></div></div>').join('')+
      '</div></div>';
  });
  if(videos.length){
    html+='<div class="section-wrap" id="videoSection">'+
      '<div class="section-header"><h2>视频中心</h2></div>'+
      '<div class="video-grid">'+
      videos.map(v=>'<div class="video-card" onclick="openVideo(\''+v.id+'\')"><div class="vthumb">'+(v.thumb||'🎬')+'<span class="play-btn">▶</span></div><div class="vinfo"><h4>'+v.title+'</h4><p>'+(v.desc||'')+'</p></div></div>').join('')+
      '</div></div>';
  }
  container.innerHTML=html;
}

function openArticle(id){
  const a=articles.find(x=>x.id===id);if(!a)return;
  const mc=document.getElementById('modalContent');
  const imgs=(a.images||[]).map(u=>'<img src="'+u+'" onerror="this.style.display=\'none\'" alt="">').join('');
  const vids=(a.videos||[]).map(v=>'<div class="video-embed"><iframe src="'+v.url+'" frameborder="0" allowfullscreen></iframe></div><p style="font-size:12px;color:var(--text3);margin-bottom:8px;text-align:center">'+v.title+'</p>').join('');
  const approved=(a.comments||[]).filter(c=>c.approved);
  const user='访客'+Math.random().toString(36).substring(2,5);
  const now=new Date();
  mc.innerHTML=
    '<div class="modal-article-title">'+a.title+'</div>'+
    '<div class="modal-article-meta">'+(a.source||'')+(a.source&&a.date?' · ':'')+(a.date||'')+'</div>'+
    '<div class="modal-article-body">'+imgs+vids+(a.content||'').replace(/\n/g,'<br>')+'</div>'+
    '<div class="comment-section">'+
    '<h4>💬 留言互动 ('+approved.length+')</h4>'+
    '<div class="comment-input"><input id="commentInput" placeholder="写下你的想法..."><button onclick="submitComment(\''+a.id+'\',\''+user+'\')">发送</button></div>'+
    '<div id="commentList">'+
    approved.map(c=>'<div class="comment-item"><div class="meta">'+c.user+' · '+c.time+'</div><div class="content">'+c.content+'</div></div>').join('')+
    '</div></div>';
  document.getElementById('modalOverlay').classList.add('open');
}

async function submitComment(aid,user){
  const input=document.getElementById('commentInput');
  const content=input.value.trim();
  if(!content){alert('请输入留言内容');return}
  input.value='';
  const r=await api('/api/comment',{articleId:aid,user,content});
  if(r&&r.ok){
    const data=await api('/api/frontend-data');
    if(data&&data.articles){
      const updated=data.articles.find(x=>x.id===aid);
      if(updated)Object.assign(articles.find(x=>x.id===aid)||{},updated);
    }
    openArticle(aid);
  }else{
    alert('留言发送成功（待审核）');
  }
}

function openVideo(id){
  const v=videos.find(x=>x.id===id);if(!v)return;
  const mc=document.getElementById('modalContent');
  mc.innerHTML=
    '<div class="modal-article-title">'+v.title+'</div>'+
    '<div class="modal-article-meta">'+(v.desc||'')+'</div>'+
    '<div class="video-embed" style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;margin:12px 0"><iframe src="'+v.url+'" frameborder="0" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%"></iframe></div>';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal()});

// Init
const now=new Date();
document.getElementById('dateDisplay').textContent=now.getFullYear()+'年'+String(now.getMonth()+1).padStart(2,'0')+'月'+String(now.getDate()).padStart(2,'0')+'日 周'+week[now.getDay()];

(async function(){
  await loadData();
  renderNav();
  renderHero();
  renderContentSections();
})();
</script>
</body>
</html>
