<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cii.中国 — 后台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#0a0a12;color:#e0e0e0;min-height:100vh}
input,select,textarea{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#e0e0e0;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:border-color 0.3s}
input:focus,select:focus,textarea:focus{border-color:#00c8ff}
textarea{resize:vertical;min-height:80px;font-family:inherit}
button{background:linear-gradient(135deg,#00c8ff,#7b61ff);border:none;color:#fff;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:14px;transition:opacity 0.3s}
button:hover{opacity:0.85}
button.sm{padding:6px 14px;font-size:12px}
button.ghost{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)}
button.danger{background:linear-gradient(135deg,#ff4757,#ff6b81)}
button.success{background:linear-gradient(135deg,#00ff96,#00c853)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.06)}
th{color:#5a7a90;font-size:13px;font-weight:600}
td{font-size:13px}
tr:hover{background:rgba(255,255,255,0.02)}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px}
.badge-superadmin{background:rgba(123,97,255,0.2);color:#7b61ff}
.badge-content{background:rgba(0,200,255,0.2);color:#00c8ff}
.badge-template{background:rgba(0,255,150,0.2);color:#00ff96}
.badge-yes{background:rgba(0,255,150,0.15);color:#00ff96}
.badge-no{background:rgba(255,71,87,0.15);color:#ff4757}
.login-page{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column}
.login-box{background:rgba(255,255,255,0.03);border:1px solid rgba(0,200,255,0.15);border-radius:16px;padding:40px;width:100%;max-width:400px}
.login-box h2{font-size:24px;margin-bottom:24px;background:linear-gradient(135deg,#00c8ff,#7b61ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box .field{margin-bottom:16px}
.login-box label{display:block;font-size:13px;color:#5a7a90;margin-bottom:6px}
.login-box .error{color:#ff4757;font-size:13px;margin-top:8px;display:none}
.login-box button{width:100%;margin-top:8px}
.login-logo{font-size:13px;color:#5a7a90;margin-bottom:30px}
.admin-header{background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);padding:0 20px;display:flex;align-items:center;height:52px;gap:10px}
.admin-header .brand{font-size:15px;font-weight:600;color:#00c8ff;white-space:nowrap}
.admin-header .nav{display:flex;gap:2px;flex:1;margin-left:12px;overflow-x:auto}
.admin-header .nav a{padding:6px 12px;border-radius:5px;font-size:12px;color:#8aaec8;cursor:pointer;text-decoration:none;transition:all 0.3s;white-space:nowrap}
.admin-header .nav a:hover{background:rgba(255,255,255,0.04);color:#e0e0e0}
.admin-header .nav a.active{background:rgba(0,200,255,0.1);color:#00c8ff}
.admin-header .user-info{font-size:12px;color:#5a7a90;display:flex;align-items:center;gap:10px;white-space:nowrap}
.admin-header .user-info .btn-logout{color:#ff4757;cursor:pointer;font-size:11px;background:none;border:none;padding:0}
.admin-body{padding:20px;max-width:1200px;margin:0 auto}
.page-section{display:none}
.page-section.active{display:block}
.page-section h3{font-size:20px;margin-bottom:16px;color:#e0e0e0}
.page-section h4{font-size:16px;margin:16px 0 10px;color:#8aaec8}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.form-grid .full{grid-column:1/-1}
.form-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.data-table{margin-top:12px;overflow-x:auto}
.empty-msg{color:#5a7a90;font-size:13px;padding:16px;text-align:center}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.template-card{border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all 0.3s}
.template-card:hover{border-color:#00c8ff;background:rgba(0,200,255,0.05)}
.template-card.active{border-color:#00c8ff;background:rgba(0,200,255,0.12)}
.template-card .icon{font-size:28px;margin-bottom:6px}
.template-card .name{font-size:13px}
.template-card .preview{font-size:10px;color:#5a7a90;margin-top:4px}
.template-card .del{position:absolute;top:6px;right:6px;background:rgba(255,71,87,0.2);border:none;color:#ff4757;border-radius:4px;cursor:pointer;font-size:12px;padding:2px 6px;display:none}
.template-card:hover .del{display:block}
.article-images{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.article-images img{width:80px;height:60px;object-fit:cover;border-radius:4px;border:1px solid rgba(255,255,255,0.08)}
.article-images .img-del{position:absolute;top:-4px;right:-4px;background:#ff4757;border:none;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;line-height:18px;text-align:center}
.image-thumb-wrap{position:relative;display:inline-block}
.image-input-row{display:flex;gap:6px;margin:4px 0}
.image-input-row input{flex:1}
.collapse-section{margin-bottom:12px}
.collapse-header{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0;font-size:14px;color:#8aaec8}
.collapse-header:hover{color:#00c8ff}
.collapse-header .arrow{transition:transform 0.3s}
.collapse-header .arrow.open{transform:rotate(90deg)}
.collapse-body{padding-left:8px}
.comment-item{padding:8px 12px;margin:4px 0;background:rgba(255,255,255,0.02);border-radius:6px;border-left:3px solid rgba(255,200,0,0.3)}
.comment-item.approved{border-left-color:#00ff96}
.comment-item .meta{font-size:11px;color:#5a7a90;margin-top:4px}
.tab-bar{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:4px}
.tab-bar button{background:none;border:none;color:#5a7a90;padding:6px 16px;cursor:pointer;font-size:13px;border-radius:4px 4px 0 0}
.tab-bar button.active{color:#00c8ff;background:rgba(0,200,255,0.06)}
.css-editor{width:100%;min-height:200px;font-family:'Consolas','Courier New',monospace;font-size:12px;line-height:1.6;tab-size:2}
@media(max-width:768px){.admin-body{padding:12px}.form-grid{grid-template-columns:1fr}.admin-header{padding:0 10px}.admin-header .brand{font-size:13px}.admin-header .nav a{padding:4px 8px;font-size:11px}}
</style>
</head>
<body id="appBody">

<div id="loginPage" class="login-page">
  <div class="login-logo">Cii.中国 后台管理系统</div>
  <div class="login-box">
    <h2>管理员登录</h2>
    <div class="field"><label>用户名</label><input id="loginUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
    <div class="error" id="loginError">用户名或密码错误</div>
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<div id="adminLayout" style="display:none">
  <div class="admin-header">
    <div class="brand">Cii.中国 后台</div>
    <div class="nav">
      <a class="active" onclick="switchPage('dashboard',this)">概览</a>
      <a onclick="switchPage('articles',this)">文章管理</a>
      <a onclick="switchPage('sections',this)">栏目管理</a>
      <a onclick="switchPage('videos',this)">视频管理</a>
      <a onclick="switchPage('comments',this)">留言审核</a>
      <a onclick="switchPage('templates',this)">模板管理</a>
      <a onclick="switchPage('admins',this)" id="navAdmins">管理员</a>
    </div>
    <div class="user-info">
      <span id="currentUser"></span>
      <button class="btn-logout" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="admin-body">

    <!-- 概览 -->
    <div class="page-section active" id="page-dashboard">
      <h3>系统概览</h3>
      <div class="form-grid" style="grid-template-columns:repeat(4,1fr)">
        <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px">
          <div style="font-size:11px;color:#5a7a90">文章总数</div>
          <div style="font-size:32px;font-weight:700;color:#00c8ff" id="statArticles">0</div>
        </div>
        <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px">
          <div style="font-size:11px;color:#5a7a90">栏目总数</div>
          <div style="font-size:32px;font-weight:700;color:#7b61ff" id="statSections">0</div>
        </div>
        <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px">
          <div style="font-size:11px;color:#5a7a90">视频总数</div>
          <div style="font-size:32px;font-weight:700;color:#00ff96" id="statVideos">0</div>
        </div>
        <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px">
          <div style="font-size:11px;color:#5a7a90">留言待审核</div>
          <div style="font-size:32px;font-weight:700;color:#ffa502" id="statComments">0</div>
        </div>
      </div>
      <div style="margin-top:16px;font-size:13px;color:#5a7a90;line-height:2">
        <p>当前用户：<strong id="dashUser"></strong> · 角色：<strong id="dashRole"></strong></p>
      </div>
    </div>

    <!-- 文章管理 -->
    <div class="page-section" id="page-articles">
      <h3>文章管理</h3>
      <div class="tab-bar" id="articleTabBar"></div>
      <div id="articleEditor">
        <div class="form-grid">
          <div class="full"><label>文章标题</label><input id="artTitle" placeholder="输入文章标题"></div>
          <div class="full">
            <label>正文内容</label>
            <div style="margin-bottom:4px;display:flex;gap:4px;flex-wrap:wrap">
              <button class="sm ghost" onclick="insertTag('artBody','b')"><b>B</b></button>
              <button class="sm ghost" onclick="insertTag('artBody','i')"><i>I</i></button>
              <button class="sm ghost" onclick="insertTag('artBody','u')"><u>U</u></button>
              <button class="sm ghost" onclick="insertTag('artBody','span',{style:'color:#00c8ff'})">色</button>
              <button class="sm ghost" onclick="insertTag('artBody','span',{style:'font-size:1.1em'})">大</button>
              <button class="sm ghost" onclick="insertTag('artBody','br')">&lt;br&gt;</button>
              <button class="sm ghost" onclick="insertTag('artBody','div')">段</button>
              <button class="sm ghost" onclick="insertTag('artBody','img',{src:'https://placehold.co/800x400/0a0a1a/00c8ff?text=图片'})">img</button>
              <button class="sm ghost" onclick="insertTag('artBody','a',{href:'#'})">链接</button>
            </div>
            <textarea id="artBody" style="min-height:150px" placeholder="输入文章正文（支持HTML标签）"></textarea>
          </div>
          <div><label>来源</label><input id="artSource" placeholder="如 新华社"></div>
          <div><label>日期</label><input id="artDate" placeholder="2026-04-30"></div>
          <div><label>精选展示</label><select id="artFeatured"><option value="true">是</option><option value="false">否</option></select></div>
          <div><label>所属栏目</label><select id="artSection"></select></div>
        </div>

        <div class="collapse-section">
          <div class="collapse-header" onclick="toggleCollapse(this)"><span class="arrow">▶</span> 图片管理（粘贴图片URL或上传）</div>
          <div class="collapse-body" style="display:none">
            <div class="image-input-row">
              <input id="artImageUrl" placeholder="输入图片URL，如 https://example.com/image.jpg">
              <button class="sm ghost" onclick="addImageUrl()">添加URL</button>
              <button class="sm success" onclick="triggerUpload('image')">上传图片</button>
              <input type="file" id="uploadImageInput" accept="image/*" style="display:none" onchange="handleUpload(this,'images')">
            </div>
            <div class="article-images" id="artImagesPreview"></div>
          </div>
        </div>

        <div class="collapse-section">
          <div class="collapse-header" onclick="toggleCollapse(this)"><span class="arrow">▶</span> 视频嵌入</div>
          <div class="collapse-body" style="display:none">
            <div class="image-input-row">
              <input id="artVideoUrl" placeholder="视频嵌入URL（YouTube/B站iframe src）">
              <input id="artVideoTitle" placeholder="视频标题" style="flex:0.5">
              <button class="sm ghost" onclick="addArticleVideo()">添加</button>
            </div>
            <div id="artVideosPreview"></div>
          </div>
        </div>

        <div class="form-actions">
          <button onclick="saveArticle()" id="saveArtBtn">发布文章</button>
          <button class="ghost" onclick="clearArticleForm()">清空</button>
          <button class="danger sm" onclick="cancelEditArticle()" id="cancelArtBtn" style="display:none">取消编辑</button>
        </div>
      </div>
      <div class="data-table" id="articleList"></div>
    </div>

    <!-- 栏目管理 -->
    <div class="page-section" id="page-sections">
      <h3>栏目管理</h3>
      <div class="form-grid">
        <div><label>栏目标识</label><input id="secKey" placeholder="如 shizheng（英文）"></div>
        <div><label>栏目名称</label><input id="secName" placeholder="如 时政深一度"></div>
      </div>
      <div class="form-actions"><button onclick="saveSection()">添加/更新栏目</button></div>
      <div class="data-table" id="sectionList"></div>
    </div>

    <!-- 视频管理 -->
    <div class="page-section" id="page-videos">
      <h3>视频管理</h3>
      <div class="form-grid">
        <div class="full"><label>视频标题</label><input id="videoTitle" placeholder="输入视频标题"></div>
        <div class="full"><label>视频描述</label><textarea id="videoDesc" placeholder="输入视频描述"></textarea></div>
        <div class="full"><label>嵌入URL</label><input id="videoUrl" placeholder="https://www.youtube.com/embed/..."></div>
        <div><label>图标</label><input id="videoIcon" value="🎬"></div>
        <div><label>日期</label><input id="videoDate" placeholder="2026-04"></div>
      </div>
      <div class="form-actions">
        <button onclick="addVideo()">添加视频</button>
        <button class="ghost" onclick="clearVideoForm()">清空</button>
      </div>
      <div class="data-table" id="videoList"></div>
    </div>

    <!-- 留言审核 -->
    <div class="page-section" id="page-comments">
      <h3>留言审核</h3>
      <div class="tab-bar">
        <button class="active" onclick="switchCommentTab(this,'all')">全部</button>
        <button onclick="switchCommentTab(this,'pending')">待审核</button>
        <button onclick="switchCommentTab(this,'approved')">已通过</button>
      </div>
      <div class="data-table" id="commentList"></div>
    </div>

    <!-- 模板管理 -->
    <div class="page-section" id="page-templates">
      <h3>模板管理</h3>
      <div style="font-size:13px;color:#5a7a90;margin-bottom:12px">选择模板可改变前台的视觉风格。点击CSS编辑可自定义颜色、字体等。</div>
      <div class="template-grid" id="templateGrid"></div>
      <div style="margin-top:10px;display:flex;gap:8px;max-width:400px">
        <input id="newTemplateName" placeholder="新模板名称" style="flex:1">
        <button class="sm" onclick="addTemplate()">新增</button>
      </div>
      <div id="templateCssEditor" style="display:none;margin-top:16px">
        <h4 style="margin-bottom:8px">编辑模板CSS变量 <span id="editTemplateName" style="font-weight:normal;color:#5a7a90"></span></h4>
        <textarea class="css-editor" id="templateCssText" placeholder=":root { --primary: #00c8ff; ... }"></textarea>
        <div class="form-actions" style="margin-top:8px">
          <button class="sm" onclick="saveTemplateCss()">保存CSS</button>
          <button class="sm ghost" onclick="document.getElementById('templateCssEditor').style.display='none'">取消</button>
        </div>
      </div>
    </div>

    <!-- 管理员 -->
    <div class="page-section" id="page-admins">
      <h3>管理员管理</h3>
      <div class="form-grid">
        <div><label>用户名</label><input id="adminUser" placeholder="输入用户名"></div>
        <div><label>密码</label><input id="adminPass" type="password" placeholder="输入密码"></div>
        <div class="full"><label>角色</label><select id="adminRole"><option value="superadmin">超级管理员</option><option value="content">内容管理员</option><option value="template">模板管理员</option></select></div>
      </div>
      <div class="form-actions"><button onclick="addAdmin()">添加管理员</button></div>
      <div class="data-table" id="adminList"></div>
    </div>

  </div>
</div>

<script>
let data={articles:[],sections:{},videos:[],templates:[],admins:[]};
let currentUser=null;
let editingArticleId=null;
let editingTemplateId=null;
let commentFilter='all';

async function api(url,body){
  try{
    const opt={method:'GET',headers:{'Content-Type':'application/json'}};
    if(body){opt.method='POST';opt.body=JSON.stringify(body)}
    const r=await fetch(url,opt);
    if(!r.ok)return {ok:false,msg:'服务器错误 ('+r.status+')'};
    return r.json();
  }catch(e){return {ok:false,msg:'无法连接服务器，请确认已运行 python server.py'}}
}

async function doLogin(){
  document.getElementById('loginError').style.display='none';
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  if(!u||!p){document.getElementById('loginError').textContent='请输入用户名和密码';document.getElementById('loginError').style.display='block';return}
  const r=await api('/api/login',{user:u,pass:p});
  if(!r.ok){document.getElementById('loginError').textContent=r.msg||'用户名或密码错误';document.getElementById('loginError').style.display='block';return}
  currentUser=r;await refreshData();showAdmin();
}

async function doLogout(){
  await api('/api/logout',{});currentUser=null;
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('adminLayout').style.display='none';
}

async function refreshData(){
  const r=await api('/api/data');if(r)data=r;
}

function showAdmin(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('adminLayout').style.display='block';
  document.getElementById('currentUser').textContent=currentUser.user+' ('+getRoleLabel(currentUser.role)+')';
  document.getElementById('dashUser').textContent=currentUser.user;
  document.getElementById('dashRole').textContent=getRoleLabel(currentUser.role);
  document.getElementById('statArticles').textContent=data.articles.length;
  document.getElementById('statSections').textContent=Object.keys(data.sections||{}).length;
  document.getElementById('statVideos').textContent=(data.videos||[]).length;
  document.getElementById('statComments').textContent=data.articles.reduce((s,a)=>(a.comments||[]).filter(c=>!c.approved).length+s,0);
  document.getElementById('navAdmins').style.display=currentUser.role==='superadmin'?'':'none';
  loadAll();
}

function getRoleLabel(r){return r==='superadmin'?'超级管理员':r==='content'?'内容管理员':r==='template'?'模板管理员':'未知'}

function switchPage(name,el){
  document.querySelectorAll('.page-section').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));
  if(el)el.classList.add('active');
}

function hasAccess(roles){
  if(!currentUser)return false;
  if(currentUser.role==='superadmin')return true;
  if(typeof roles==='string')return currentUser.role===roles;
  return roles.includes(currentUser.role);
}

function toggleCollapse(el){
  el.querySelector('.arrow').classList.toggle('open');
  const body=el.nextElementSibling;
  body.style.display=body.style.display==='none'?'block':'none';
}

function insertTag(id,tag,attrs){
  const ta=document.getElementById(id);
  const start=ta.selectionStart,end=ta.selectionEnd;
  const sel=ta.value.substring(start,end);
  const before=ta.value.substring(0,start),after=ta.value.substring(end);
  let open='<'+tag,close='</'+tag+'>';
  if(tag==='br'||tag==='img')close='';
  if(tag==='br'){open='<br>';close=''}
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{open+=' '+k+'="'+v+'"'});
  open+='>';
  ta.value=before+open+sel+close+after;
  ta.focus();ta.selectionStart=ta.selectionEnd=start+open.length+sel.length;
}

// ===== ARTICLE MANAGEMENT =====
function renderArticleSections(){
  const keys=Object.keys(data.sections||{});
  const sel=document.getElementById('artSection');
  const tabBar=document.getElementById('articleTabBar');
  sel.innerHTML='<option value="">-- 选择栏目 --</option>'+keys.map(k=>'<option value="'+k+'">'+data.sections[k]+'</option>').join('');
  tabBar.innerHTML='<button class="active" onclick="switchArticleTab(this,\'\')">全部</button>'+keys.map(k=>'<button onclick="switchArticleTab(this,\''+k+'\')">'+data.sections[k]+'</button>').join('');
}

let articleFilter='';

function switchArticleTab(el,key){
  document.querySelectorAll('#articleTabBar button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');articleFilter=key;renderArticleList();
}

function renderArticleList(){
  const c=document.getElementById('articleList');
  let articles=data.articles;
  if(articleFilter)articles=articles.filter(a=>a.section===articleFilter);
  if(!articles||!articles.length){c.innerHTML='<div class="empty-msg">暂无文章</div>';return}
  const names=data.sections||{};
  let html='<table><tr><th>标题</th><th>栏目</th><th>图片</th><th>视频</th><th>留言</th><th>日期</th><th>操作</th></tr>';
  articles.forEach(a=>{
    const imgCount=(a.images||[]).length;
    const videoCount=(a.videos||[]).length;
    const commentCount=(a.comments||[]).length;
    html+='<tr><td>'+a.title+'</td><td><span style="color:#5a7a90;font-size:12px">'+(names[a.section]||a.section)+'</span></td><td>'+(imgCount?'📷'+imgCount:'-')+'</td><td>'+(videoCount?'🎬'+videoCount:'-')+'</td><td>'+(commentCount?'💬'+commentCount:'-')+'</td><td style="font-size:12px;color:#5a7a90">'+(a.date||'-')+'</td><td><button class="sm ghost" onclick="editArticle(\''+a.id+'\')">编辑</button> <button class="sm danger" onclick="deleteArticle(\''+a.id+'\')">删除</button></td></tr>';
  });
  html+='</table>';
  c.innerHTML=html;
}

function clearArticleForm(){
  document.getElementById('artTitle').value='';
  document.getElementById('artBody').value='';
  document.getElementById('artSource').value='';
  document.getElementById('artDate').value='';
  document.getElementById('artFeatured').value='false';
  document.getElementById('artImagesPreview').innerHTML='';
  document.getElementById('artVideosPreview').innerHTML='';
  document.getElementById('cancelArtBtn').style.display='none';
  document.getElementById('saveArtBtn').textContent='发布文章';
  editingArticleId=null;
}

function editArticle(id){
  const a=data.articles.find(x=>x.id===id);if(!a)return;
  editingArticleId=id;
  document.getElementById('artTitle').value=a.title;
  document.getElementById('artBody').value=a.content;
  document.getElementById('artSource').value=a.source||'';
  document.getElementById('artDate').value=a.date||'';
  document.getElementById('artFeatured').value=a.featured?'true':'false';
  document.getElementById('artSection').value=a.section;
  renderImagesPreview(a.images||[]);
  renderVideosPreview(a.videos||[]);
  document.getElementById('cancelArtBtn').style.display='';
  document.getElementById('saveArtBtn').textContent='更新文章';
  document.getElementById('articleEditor').scrollIntoView({behavior:'smooth'});
}

function cancelEditArticle(){clearArticleForm();}

function getArticleFormData(){
  const section=document.getElementById('artSection').value;
  if(!section){alert('请选择栏目');return null}
  const title=document.getElementById('artTitle').value.trim();
  if(!title){alert('请输入标题');return null}
  const images=[...document.querySelectorAll('#artImagesPreview img')].map(img=>img.src);
  const videos=[...document.querySelectorAll('#artVideosPreview .video-tag')].map(el=>JSON.parse(el.dataset.video));
  return {
    section,title,
    content:document.getElementById('artBody').value.trim()||'暂无内容',
    source:document.getElementById('artSource').value.trim(),
    date:document.getElementById('artDate').value.trim(),
    featured:document.getElementById('artFeatured').value==='true',
    images,videos
  };
}

async function saveArticle(){
  if(!hasAccess(['superadmin','content'])){alert('权限不足');return}
  const fd=getArticleFormData();if(!fd)return;
  if(editingArticleId){
    const idx=data.articles.findIndex(a=>a.id===editingArticleId);
    if(idx>=0){Object.assign(data.articles[idx],fd);data.articles[idx].comments=data.articles[idx].comments||[]}
  }else{
    fd.id='a'+Date.now();fd.comments=[];
    data.articles.push(fd);
  }
  await api('/api/data',{articles:data.articles});
  clearArticleForm();renderArticleList();updateStats();
  alert('文章已'+(editingArticleId?'更新':'发布'));
}

async function deleteArticle(id){
  if(!confirm('确认删除此文章？'))return;
  data.articles=data.articles.filter(a=>a.id!==id);
  await api('/api/data',{articles:data.articles});renderArticleList();updateStats();
}

// image management
function addImageUrl(){
  const url=document.getElementById('artImageUrl').value.trim();
  if(!url){alert('请输入图片URL');return}
  document.getElementById('artImageUrl').value='';
  renderImagesPreview([...getCurrentImages(),url]);
}

function getCurrentImages(){
  return [...document.querySelectorAll('#artImagesPreview img')].map(img=>img.src);
}

function renderImagesPreview(images){
  const c=document.getElementById('artImagesPreview');
  c.innerHTML=images.map((url,i)=>'<span class="image-thumb-wrap"><img src="'+url+'" onerror="this.style.display=\'none\'"><button class="img-del" onclick="removeImage('+i+')">×</button></span>').join('');
}

function removeImage(idx){
  const imgs=getCurrentImages();imgs.splice(idx,1);renderImagesPreview(imgs);
}

async function triggerUpload(type){
  document.getElementById('uploadImageInput').click();
}

async function handleUpload(input,target){
  const file=input.files[0];if(!file)return;
  const form=new FormData();form.append('file',file);
  try{
    const r=await fetch('/api/upload',{method:'POST',body:form});
    const d=await r.json();
    if(d.ok){
      if(target==='images'){
        renderImagesPreview([...getCurrentImages(),d.url]);
      }
    }else{alert(d.msg||'上传失败')}
  }catch(e){alert('上传失败')}
  input.value='';
}

// article videos
function addArticleVideo(){
  const url=document.getElementById('artVideoUrl').value.trim();
  const title=document.getElementById('artVideoTitle').value.trim()||'视频';
  if(!url){alert('请输入视频URL');return}
  document.getElementById('artVideoUrl').value='';document.getElementById('artVideoTitle').value='';
  const videos=[...getArticleVideos(),{title,url}];
  renderVideosPreview(videos);
}

function getArticleVideos(){
  return [...document.querySelectorAll('#artVideosPreview .video-tag')].map(el=>JSON.parse(el.dataset.video));
}

function renderVideosPreview(videos){
  const c=document.getElementById('artVideosPreview');
  c.innerHTML=videos.map((v,i)=>'<span class="video-tag" data-video=\''+JSON.stringify(v)+'\' style="display:inline-flex;align-items:center;gap:6px;background:rgba(0,200,255,0.06);border-radius:4px;padding:4px 10px;margin:2px;font-size:12px">🎬 '+v.title+' <span style="color:#ff4757;cursor:pointer" onclick="removeArticleVideo('+i+')">×</span></span>').join('');
}

function removeArticleVideo(idx){
  const v=getArticleVideos();v.splice(idx,1);renderVideosPreview(v);
}

// ===== SECTIONS =====
function renderSections(){
  const c=document.getElementById('sectionList');
  const sec=data.sections||{};
  const keys=Object.keys(sec);
  if(!keys.length){c.innerHTML='<div class="empty-msg">暂无栏目</div>';return}
  let html='<table><tr><th>标识</th><th>栏目名称</th><th>文章数</th><th>操作</th></tr>';
  keys.forEach(k=>{
    const count=data.articles.filter(a=>a.section===k).length;
    html+='<tr><td style="color:#5a7a90;font-size:12px">'+k+'</td><td>'+sec[k]+'</td><td>'+count+'</td><td><button class="sm danger" onclick="deleteSection(\''+k+'\')">删除</button></td></tr>';
  });
  html+='</table>';
  c.innerHTML=html;
}

async function saveSection(){
  if(!hasAccess(['superadmin','content'])){alert('权限不足');return}
  const k=document.getElementById('secKey').value.trim();
  const n=document.getElementById('secName').value.trim();
  if(!k||!n){alert('请输入栏目标识和名称');return}
  const sec=data.sections||{};sec[k]=n;
  await api('/api/data',{sections:sec});data.sections=sec;
  document.getElementById('secKey').value='';document.getElementById('secName').value='';
  renderSections();renderArticleSections();updateStats();
}

async function deleteSection(key){
  if(!confirm('删除栏目「'+key+'」？文章不会自动删除'))return;
  const sec=data.sections||{};delete sec[key];
  await api('/api/data',{sections:sec});data.sections=sec;
  renderSections();renderArticleSections();updateStats();
}

// ===== VIDEOS =====
function renderVideos(){
  const c=document.getElementById('videoList');
  if(!data.videos||!data.videos.length){c.innerHTML='<div class="empty-msg">暂无视频</div>';return}
  let html='<table><tr><th>标题</th><th>日期</th><th>操作</th></tr>';
  data.videos.forEach((v,i)=>{html+='<tr><td>'+v.title+'</td><td style="font-size:12px;color:#5a7a90">'+(v.date||'-')+'</td><td><button class="sm danger" onclick="deleteVideo('+i+')">删除</button></td></tr>'});
  html+='</table>';c.innerHTML=html;
}

async function addVideo(){
  if(!hasAccess(['superadmin','content'])){alert('权限不足');return}
  const t=document.getElementById('videoTitle').value.trim();if(!t){alert('请输入标题');return}
  if(!data.videos)data.videos=[];
  data.videos.push({id:'v'+Date.now(),title:t,desc:document.getElementById('videoDesc').value.trim(),url:document.getElementById('videoUrl').value.trim(),thumb:document.getElementById('videoIcon').value.trim()||'🎬',date:document.getElementById('videoDate').value.trim()});
  await api('/api/data',{videos:data.videos});clearVideoForm();renderVideos();updateStats();
}

function clearVideoForm(){['videoTitle','videoDesc','videoUrl','videoDate'].forEach(id=>document.getElementById(id).value='');document.getElementById('videoIcon').value='🎬'}

async function deleteVideo(i){if(!confirm('确认删除？'))return;data.videos.splice(i,1);await api('/api/data',{videos:data.videos});renderVideos();updateStats()}

// ===== COMMENTS =====
function renderComments(){
  const c=document.getElementById('commentList');
  let all=[];
  data.articles.forEach(a=>{
    (a.comments||[]).forEach(cmt=>{all.push({...cmt,articleTitle:a.title,articleId:a.id})});
  });
  if(commentFilter==='pending')all=all.filter(c=>!c.approved);
  if(commentFilter==='approved')all=all.filter(c=>c.approved);
  if(!all.length){c.innerHTML='<div class="empty-msg">暂无留言</div>';return}
  let html='<table><tr><th>用户</th><th>内容</th><th>文章</th><th>时间</th><th>状态</th><th>操作</th></tr>';
  all.forEach(cmt=>{
    html+='<tr><td>'+cmt.user+'</td><td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+cmt.content+'</td><td style="font-size:12px;color:#5a7a90">'+(cmt.articleTitle||'-').substring(0,20)+'</td><td style="font-size:11px;color:#5a7a90">'+cmt.time+'</td><td><span class="badge '+(cmt.approved?'badge-yes':'badge-no')+'">'+(cmt.approved?'已通过':'待审核')+'</span></td><td>'+
      (!cmt.approved?'<button class="sm success" onclick="approveComment(\''+cmt.id+'\',true)">通过</button> ':'')+
      '<button class="sm danger" onclick="deleteComment(\''+cmt.id+'\')">删除</button></td></tr>';
  });
  html+='</table>';c.innerHTML=html;
}

function switchCommentTab(el,filter){
  document.querySelectorAll('#page-comments .tab-bar button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');commentFilter=filter;renderComments();
}

async function approveComment(id,approved){
  await api('/api/comments/approve',{id,approved});
  await refreshData();renderComments();updateStats();
}

async function deleteComment(id){
  if(!confirm('确认删除此留言？'))return;
  await api('/api/comments/delete',{id});
  await refreshData();renderComments();updateStats();
}

// ===== TEMPLATES =====
function renderTemplates(){
  const grid=document.getElementById('templateGrid');
  grid.innerHTML='';
  (data.templates||[]).forEach(t=>{
    const card=document.createElement('div');
    card.className='template-card'+(t.active?' active':'');
    card.style.position='relative';
    if(hasAccess(['superadmin','template'])){
      card.innerHTML='<div class="icon">'+(t.icon||'📄')+'</div><div class="name">'+t.name+'</div><div class="preview">'+(t.active?'✓ 当前使用':'点击切换')+'</div><button class="del" onclick="event.stopPropagation();deleteTemplate(\''+t.id+'\')">×</button>';
      card.onclick=()=>selectTemplate(t.id);
    }else{
      card.innerHTML='<div class="icon">'+(t.icon||'📄')+'</div><div class="name">'+t.name+'</div><div class="preview">'+(t.active?'✓ 当前使用':'')+'</div>';
    }
    const editBtn=document.createElement('button');
    editBtn.className='sm ghost';editBtn.textContent='编辑CSS';
    editBtn.style.cssText='margin-top:6px;font-size:11px';
    editBtn.onclick=(e)=>{e.stopPropagation();openCssEditor(t.id)};
    if(hasAccess(['superadmin','template']))card.appendChild(editBtn);
    grid.appendChild(card);
  });
}

async function selectTemplate(id){
  if(!hasAccess(['superadmin','template'])){alert('权限不足');return}
  (data.templates||[]).forEach(t=>t.active=(t.id===id));
  await api('/api/data',{templates:data.templates});
  renderTemplates();
}

async function addTemplate(){
  if(!hasAccess(['superadmin','template'])){alert('权限不足');return}
  const name=document.getElementById('newTemplateName').value.trim();
  if(!name){alert('请输入模板名称');return}
  if(!data.templates)data.templates=[];
  data.templates.push({id:'tm'+Date.now(),name,icon:'📄',active:false,css:''});
  await api('/api/data',{templates:data.templates});
  document.getElementById('newTemplateName').value='';renderTemplates();
}

async function deleteTemplate(id){
  if(!hasAccess(['superadmin','template'])){alert('权限不足');return}
  if(!confirm('确认删除模板？'))return;
  data.templates=data.templates.filter(t=>t.id!==id);
  await api('/api/data',{templates:data.templates});renderTemplates();
}

function openCssEditor(id){
  editingTemplateId=id;
  const t=data.templates.find(x=>x.id===id);
  if(!t)return;
  document.getElementById('templateCssEditor').style.display='block';
  document.getElementById('templateCssText').value=t.css||'';
  document.getElementById('editTemplateName').textContent='— '+t.name;
}

async function saveTemplateCss(){
  if(!editingTemplateId)return;
  const t=data.templates.find(x=>x.id===editingTemplateId);
  if(!t)return;
  t.css=document.getElementById('templateCssText').value;
  await api('/api/data',{templates:data.templates});
  alert('CSS已保存');document.getElementById('templateCssEditor').style.display='none';
}

// ===== ADMINS =====
function renderAdmins(){
  if(!hasAccess('superadmin')){document.getElementById('adminList').innerHTML='';return}
  let html='<table><tr><th>用户名</th><th>角色</th><th>操作</th></tr>';
  data.admins.forEach((a,i)=>{html+='<tr><td>'+a.user+'</td><td><span class="badge badge-'+a.role+'">'+getRoleLabel(a.role)+'</span></td><td>'+(data.admins.length>1?'<button class="sm danger" onclick="deleteAdmin(\''+a.id+'\')">删除</button>':'')+'</td></tr>'});
  document.getElementById('adminList').innerHTML=html+'</table>';
}

async function addAdmin(){
  if(!hasAccess('superadmin')){alert('权限不足');return}
  const u=document.getElementById('adminUser').value.trim(),p=document.getElementById('adminPass').value.trim();
  if(!u||!p){alert('请输入用户名和密码');return}
  if(data.admins.find(a=>a.user===u)){alert('用户名已存在');return}
  data.admins.push({id:'a'+Date.now(),user:u,pass:p,role:document.getElementById('adminRole').value,name:u});
  await api('/api/data',{admins:data.admins});
  document.getElementById('adminUser').value='';document.getElementById('adminPass').value='';
  renderAdmins();
}

async function deleteAdmin(id){
  if(!hasAccess('superadmin'))return;
  if(data.admins.length<=1){alert('至少保留一个管理员');return}
  if(!confirm('确认删除？'))return;
  data.admins=data.admins.filter(a=>a.id!==id);
  await api('/api/data',{admins:data.admins});renderAdmins();
}

function updateStats(){
  document.getElementById('statArticles').textContent=data.articles.length;
  document.getElementById('statSections').textContent=Object.keys(data.sections||{}).length;
  document.getElementById('statVideos').textContent=(data.videos||[]).length;
  document.getElementById('statComments').textContent=data.articles.reduce((s,a)=>(a.comments||[]).filter(c=>!c.approved).length+s,0);
}

function loadAll(){
  renderArticleSections();renderArticleList();renderSections();renderVideos();renderComments();renderTemplates();renderAdmins();
  document.getElementById('artSection').value='';
  updateStats();
}

// Auto-login
(async function(){
  try{
    const s=await api('/api/session');
    if(s&&s.user){
      const chk=await api('/api/session/check');
      if(chk&&chk.ok){currentUser=chk;await refreshData();showAdmin()}
    }
  }catch(e){}
})();
</script>
